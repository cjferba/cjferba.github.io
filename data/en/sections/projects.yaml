- name: A fuzzy-based medical system for pattern mining in a distributed environment Application to diagnostic and co-morbidity
  role: Author
  timeline: "Jun 2022"
  url: "https://www.sciencedirect.com/science/article/pii/S1568494622002538"
  summary: In this paper we have addressed the extraction of hidden knowledge from medical records using data mining techniques such as association rules in conjunction with fuzzy logic in a distributed environment. A significant challenge in this domain is that although there are a lot of studies devoted to analysing health data, very few focus on the understanding and interpretability of the data and the hidden patterns present within the data. A major challenge in this area is that many health data analysis studies have focussed on classification, prediction or knowledge extraction and end users find little interpretability or understanding of the results. This is due to the use of black-box algorithms or because the nature of the data is not represented correctly. This is why it is necessary to focus the analysis not only on knowledge extraction but also on the transformation and processing of the data to improve the modelling of the nature of the data. Techniques such as association rule mining and fuzzy logic help to improve the interpretability of the data and treat it with the inherent uncertainty of real-world data. To this end, we propose a system that automatically a) pre-processes the database by transforming and adapting the data for the data mining process and enriching the data to generate more interesting patterns, b) performs the fuzzification of the medical database to represent and analyse real-world medical data with its inherent uncertainty, c) discovers interrelations and patterns amongst different features (diagnostic, hospital discharge, etc.), and d) visualizes the obtained results efficiently to facilitate the analysis and improve the interpretability of the information extracted. Our proposed system yields a significant increase in the compression and interpretability of medical data for end-users, allowing them to analyse the data correctly and make the right decisions. We present one practical case using two health-related datasets to demonstrate the feasibility of our proposal for real data.
  tags: ["academic","health", "Big Data"]


- name: Big Data Architecture for Building Energy Managament Systems
  role: Author
  timeline: "Nov 2021"
  url: "https://ieeexplore.ieee.org/abstract/document/9625776"
  summary: The enormous quantity of data handled by Building management systems are key to develop more efficient energy operational systems. However, the inability of current systems to take benefit from the generated data may waste good opportunities of improving building performance. Big Data appears as a suitable framework to sustain the management system and conduct future prospective analysis. In this work we present a Big Data based architecture for the efficient management of buildings. The different Big Data components are involved not only in the data acquisition phase, but also in the implementation of algorithms capable of analysing massive data collected from very heterogeneous sources. They also enable fast computations that can help the generation of optimal operational plan generations to improve the building functioning. The proposed architecture has been effectively introduced in four different-purpose buildings, demonstrating that Big Data can help during the energy cycle of the building.
  tags: ["academic","Energy", "Big Data"]

- name: Spark solutions for discovering fuzzy association rules in Big Data
  role: Author
  timeline: "Jan 2019"
  url: "https://www.sciencedirect.com/science/article/pii/S0888613X21001031"
  summary: The high computational impact when mining fuzzy association rules grows significantly when managing very large data sets, triggering in many cases a memory overflow error and leading to the experiment failure without its conclusion. It is in these cases when the application of Big Data techniques can help to achieve the experiment completion. Therefore, in this paper several Spark algorithms are proposed to handle with massive fuzzy data and discover interesting association rules. For that, we based on a decomposition of interestingness measures in terms of α-cuts, and we experimentally demonstrate that it is sufficient to consider only 10 equidistributed α-cuts in order to mine all significant fuzzy association rules. Additionally, all the proposals are compared and analysed in terms of efficiency and speed up, in several datasets, including a real dataset comprised of sensor measurements from an office building.
  tags: ["academic","ARM","FIM", "Big Data"]

- name: A Fuzzy Mining Approach for Energy Efficiency in a Big Data Framework
  role: Author
  timeline: "May 2020"
  url: "https://ieeexplore.ieee.org/abstract/document/9085888"
  summary: The discovery and exploitation of hidden information in collected data have gained attention in many areas, particularly in the energy field due to their economic and environmental impact. Data mining techniques have then emerged as a suitable toolbox for analyzing the data collected in modern network management systems in order to obtain a meaningful insight into consumption patterns and equipment operation. However, the enormous amount of data generated by sensors, occupational, and meteorological data involve the use of new management systems and data processing. Big Data presents great opportunities for implementing new solutions to manage these massive data sets. In addition, these data present values whose nature complicates and hides the understanding and interpretation of the data and results. Therefore, the use of fuzzy methods to adequately transform the data can improve their interpretability. This article presents an automatic fuzzification method implemented using the Big Data paradigm, which enables, in a later step, the detection of interrelations and patterns among different sensors and weather data recovered from an office building.
  tags: ["academic","Buildings","Data mining", "Sensors", "Big Data", "Itemsets", "Linguistics"]

- name: Finding tendencies in streaming data using big data frequent itemset mining
  role: Author
  timeline: "Jan 2019"
  url: "https://www.sciencedirect.com/science/article/pii/S0950705118304775"
  summary: The amount of information generated in social media channels or economical/business transactions exceeds the usual bounds of static databases and is in continuous growing. In this work, we propose a frequent itemset mining method using sliding windows capable of extracting tendencies from continuous data flows. For that aim, we develop this method using Big Data technologies, in particular, using the Spark Streaming framework enabling distributing the computation along several clusters and thus improving the algorithm speed. The experimentation carried out shows the capability of our proposal and its scalability when massive amounts of data coming from streams are taken into account.
  tags: ["academic","Streaming","FIM", "Big Data"]

- name: A Probabilistic Algorithm for Predictive Control With Full-Complexity Models in Non-Residential Buildings
  role: Author
  timeline: "Mar 2019"
  url: "https://ieeexplore.ieee.org/abstract/document/8669762"
  summary: Despite the increasing capabilities of information technologies for data acquisition and processing, building energy management systems still require manual configuration and supervision to achieve optimal performance. Model predictive control (MPC) aims to leverage equipment control-particularly heating, ventilation, and air conditioning (HVAC)-by using a model of the building to capture its dynamic characteristics and to predict its response to alternative control scenarios. Usually, MPC approaches are based on simplified linear models, which support faster computation but also present some limitations regarding interpretability, solution diversification, and longer-term optimization. In this paper, we propose a novel MPC algorithm that uses a full-complexity grey-box simulation model to optimize HVAC operation in non-residential buildings. Our system generates hundreds of candidate operation plans, typically …
  tags: ["academic","Buildings","Computational modeling", "Predictive models", "Biological system modeling", "HVAC", "Data models", "Optimization"]


